[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Mirror=https://mirrors.aliyun.com

[Output]
Format=disk
ImageId=oneos
ImageVersion=0.0.1
OutputDirectory=mkosi.output
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
Packages=
    linux-image-amd64
    systemd-boot-efi
    openssh-server
    bash
    ca-certificates
    curl
    less
    nano
    htop
    tree
    file
    lsof
    login
    procps
    psmisc
    util-linux
    kmod
    pciutils
    usbutils
    iproute2
    iputils-ping
    e2fsprogs
    dosfstools
    locales
    systemd-resolved
    dbus
    libpam-systemd
WithDocs=no
Hostname=oneos
Locale=en_US.UTF-8
Timezone=Asia/Shanghai
RootShell=/bin/bash
Autologin=yes
KernelCommandLine=root=PARTUUID rw console=ttyS0
